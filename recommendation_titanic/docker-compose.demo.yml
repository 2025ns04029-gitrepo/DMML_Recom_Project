services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: titanic
      POSTGRES_USER: shubhangi
      POSTGRES_PASSWORD: titanic_demo_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shubhangi -d titanic"]
      interval: 10s
      timeout: 5s
      retries: 5

  application:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      RECOMMENDATION_TITANIC_DB: titanic
      RECOMMENDATION_TITANIC_DB_USER: shubhangi
      RECOMMENDATION_TITANIC_DB_PASSWORD: titanic_demo_password
      RECOMMENDATION_TITANIC_DB_HOST: postgres
      RECOMMENDATION_TITANIC_DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
